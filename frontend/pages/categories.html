<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — ExpenseFlow</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css?v=1.0.4">
  <link rel="stylesheet" href="../css/dashboard.css?v=1.0.4">
  <link rel="stylesheet" href="../css/responsive.css?v=1.0.4">
  <style>
    .cat-tab-btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.875rem;
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .cat-tab-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="page-content">
        <!-- Filter Tabs & Actions Toolbar -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
          <div class="toolbar" style="margin-bottom: 0;">
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <button type="button" class="cat-tab-btn active" data-type="all">All Categories</button>
              <button type="button" class="cat-tab-btn" data-type="expense">Expenses</button>
              <button type="button" class="cat-tab-btn" data-type="income">Income</button>
            </div>

            <button type="button" class="btn btn-primary btn-sm" id="open-create-cat-btn">+ Create Category</button>
          </div>
        </div>

        <!-- Categories Grid -->
        <div id="categories-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;"></div>

        <!-- Empty State -->
        <div id="cat-empty-state" class="empty-state card" style="display: none; margin-top: 1rem;">
          <div class="empty-state-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path></svg>
          </div>
          <div class="empty-state-title">No categories found</div>
          <div class="empty-state-desc">Create custom categories to organize your financial flow.</div>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('open-create-cat-btn').click()">+ Create Category</button>
        </div>
      </main>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal-overlay" id="cat-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="cat-modal-title">Create Category</h3>
        <button type="button" class="btn-icon btn-ghost" id="close-cat-modal" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="cat-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="cat-name-input" class="form-label">Category Name</label>
            <input type="text" id="cat-name-input" class="form-input" placeholder="e.g. Subscriptions & SaaS" required maxlength="50">
          </div>

          <div class="form-group">
            <label for="cat-type-select" class="form-label">Category Type</label>
            <select id="cat-type-select" class="form-select">
              <option value="expense" selected>Expense</option>
              <option value="income">Income</option>
              <option value="both">Both (Income & Expense)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Badge Color</label>
            <div id="color-swatches" style="display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.5rem;"></div>
            <input type="hidden" id="cat-color-input" value="#4F46E5">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-cat-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-cat-btn">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/categories.js"></script>
</body>
</html>
