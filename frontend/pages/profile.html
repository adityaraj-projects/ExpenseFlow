<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — ExpenseFlow</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="page-content" style="max-width: 800px;">
        <!-- Profile Details Card -->
        <div class="card" style="margin-bottom: 2rem;">
          <div class="card-header">
            <div>
              <h2 class="card-title">Profile Information</h2>
              <p class="card-subtitle">Update your personal account details</p>
            </div>
          </div>

          <form id="profile-form">
            <div class="form-group">
              <label for="profile-name" class="form-label">Full Name</label>
              <input type="text" id="profile-name" class="form-input" required minlength="2" maxlength="100">
            </div>

            <div class="form-group">
              <label for="profile-email" class="form-label">Email Address</label>
              <input type="email" id="profile-email" class="form-input" disabled style="opacity: 0.7; cursor: not-allowed;">
              <span style="font-size: 0.75rem; color: var(--text-muted);">Email address cannot be modified once registered.</span>
            </div>

            <div class="form-group">
              <label for="profile-currency" class="form-label">Default Currency</label>
              <select id="profile-currency" class="form-select">
                <option value="INR">Indian Rupee (₹ INR)</option>
                <option value="USD">US Dollar ($ USD)</option>
                <option value="EUR">Euro (€ EUR)</option>
                <option value="GBP">British Pound (£ GBP)</option>
                <option value="CAD">Canadian Dollar (C$ CAD)</option>
                <option value="AUD">Australian Dollar (A$ AUD)</option>
                <option value="JPY">Japanese Yen (¥ JPY)</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Profile</button>
          </form>
        </div>

        <!-- Change Password Card -->
        <div class="card">
          <div class="card-header">
            <div>
              <h2 class="card-title">Change Password</h2>
              <p class="card-subtitle">Ensure your account is protected with a strong password</p>
            </div>
          </div>

          <form id="password-form">
            <div class="form-group">
              <label for="current-pwd" class="form-label">Current Password</label>
              <input type="password" id="current-pwd" class="form-input" required minlength="6">
            </div>

            <div class="form-group">
              <label for="new-pwd" class="form-label">New Password</label>
              <input type="password" id="new-pwd" class="form-input" required minlength="6">
            </div>

            <div class="form-group">
              <label for="confirm-new-pwd" class="form-label">Confirm New Password</label>
              <input type="password" id="confirm-new-pwd" class="form-input" required minlength="6">
            </div>

            <button type="submit" class="btn btn-secondary" id="save-pwd-btn">Update Password</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.initAppShell('profile');
      const user = Auth.getCurrentUser();

      if (user) {
        document.getElementById('profile-name').value = user.full_name || '';
        document.getElementById('profile-email').value = user.email || '';
        document.getElementById('profile-currency').value = user.currency || 'INR';
      }

      // Profile update
      const profileForm = document.getElementById('profile-form');
      profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('save-profile-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        const full_name = document.getElementById('profile-name').value.trim();
        const currency = document.getElementById('profile-currency').value;

        try {
          const updatedUser = await ApiClient.put('/auth/profile', { full_name, currency });
          const token = Auth.getToken();
          Auth.setSession(token, updatedUser);
          showToast('Profile updated successfully!', 'success');
          Auth.initAppShell('profile');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Profile';
        }
      });

      // Password update
      const pwdForm = document.getElementById('password-form');
      pwdForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const current_password = document.getElementById('current-pwd').value;
        const new_password = document.getElementById('new-pwd').value;
        const confirm_new_password = document.getElementById('confirm-new-pwd').value;

        if (new_password !== confirm_new_password) {
          showToast('New passwords do not match.', 'error');
          return;
        }

        const submitBtn = document.getElementById('save-pwd-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
          await ApiClient.put('/auth/change-password', {
            current_password,
            new_password,
            confirm_new_password
          });
          showToast('Password changed successfully!', 'success');
          pwdForm.reset();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
