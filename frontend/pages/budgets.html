<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgets — ExpenseFlow</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="page-content">
        <!-- Monthly Period Selector & Controls Bar -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
          <div class="toolbar" style="margin-bottom: 0;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <select id="budget-month-select" class="form-select" style="width: auto; font-weight: 700;"></select>
              <select id="budget-year-select" class="form-select" style="width: auto; font-weight: 700;"></select>
            </div>

            <button type="button" class="btn btn-primary btn-sm" id="open-create-budget-btn">+ Set Category Budget</button>
          </div>
        </div>

        <!-- Monthly Overall Budget Summary -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
          <div class="card" style="padding: 1.25rem;">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Total Budget Allocated</div>
            <div id="total-budget-val" style="font-size: 1.625rem; font-weight: 800; color: var(--text-main); margin-top: 0.25rem;">₹0.00</div>
          </div>
          <div class="card" style="padding: 1.25rem;">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Actual Spent So Far</div>
            <div id="total-spent-val" style="font-size: 1.625rem; font-weight: 800; color: var(--danger); margin-top: 0.25rem;">₹0.00</div>
          </div>
          <div class="card" style="padding: 1.25rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Net Remaining</div>
              <span id="budget-usage-badge" class="badge badge-primary">0% used</span>
            </div>
            <div id="total-remaining-val" style="font-size: 1.625rem; font-weight: 800; margin-top: 0.25rem;">₹0.00</div>
          </div>
        </div>

        <!-- Category Budgets Grid -->
        <div id="budgets-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;"></div>

        <!-- Empty State -->
        <div id="budgets-empty-state" class="empty-state card" style="display: none; margin-top: 1rem;">
          <div class="empty-state-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          </div>
          <div class="empty-state-title">No category budgets defined for this month</div>
          <div class="empty-state-desc">Setting monthly category budgets helps you plan and prevent unexpected overspending.</div>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('open-create-budget-btn').click()">+ Set Category Budget</button>
        </div>
      </main>
    </div>
  </div>

  <!-- Budget Modal -->
  <div class="modal-overlay" id="budget-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="budget-modal-title">Set Monthly Budget</h3>
        <button type="button" class="btn-icon btn-ghost" id="close-budget-modal" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="budget-form">
        <div class="modal-body">
          <div class="form-group" id="budget-cat-group">
            <label for="budget-category-select" class="form-label">Expense Category</label>
            <select id="budget-category-select" class="form-select" required></select>
          </div>

          <div class="form-group">
            <label for="budget-amount-input" class="form-label">Budget Limit Amount</label>
            <input type="number" id="budget-amount-input" class="form-input" placeholder="e.g. 15000" min="1" step="0.01" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-budget-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-budget-btn">Save Budget</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/budgets.js"></script>
</body>
</html>
