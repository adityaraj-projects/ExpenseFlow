<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Reminders — ExpenseFlow</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content Area -->
    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="page-content">
        <!-- Toolbar & Filter Tabs -->
        <div class="toolbar">
          <div class="filter-group">
            <button class="report-time-btn active" data-status="upcoming" onclick="RemindersPage.filterStatus('upcoming', this)">
              Upcoming
            </button>
            <button class="report-time-btn" data-status="completed" onclick="RemindersPage.filterStatus('completed', this)">
              Completed
            </button>
            <button class="report-time-btn" data-status="all" onclick="RemindersPage.filterStatus('all', this)">
              All
            </button>
          </div>

          <div class="filter-group">
            <div class="search-input-wrapper">
              <input type="text" id="reminder-search" class="form-input" placeholder="Search reminders..." oninput="RemindersPage.onSearchInput(this.value)">
            </div>
            <button class="btn btn-primary" onclick="RemindersPage.openCreateModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>New Reminder</span>
            </button>
          </div>
        </div>

        <!-- Reminders Container -->
        <div id="reminders-container" class="upcoming-grid">
          <!-- Dynamically populated or skeleton loader -->
          <div class="card skeleton-card" style="height: 140px;"></div>
          <div class="card skeleton-card" style="height: 140px;"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create / Edit Reminder Modal -->
  <div class="modal-overlay" id="reminder-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="reminder-modal-title">Create Reminder</h3>
        <button class="modal-close-btn" onclick="RemindersPage.closeModal()">&times;</button>
      </div>

      <form id="reminder-form" onsubmit="RemindersPage.saveReminder(event)">
        <input type="hidden" id="reminder-id">

        <div class="form-group">
          <label class="form-label" for="rem-title">Title *</label>
          <input type="text" id="rem-title" class="form-input" placeholder="e.g. Hostel Fee, Rent, Electricity Bill" required maxlength="150">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="rem-amount">Amount (₹ optional)</label>
            <input type="number" id="rem-amount" class="form-input" placeholder="0.00" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label class="form-label" for="rem-category">Category</label>
            <select id="rem-category" class="form-input">
              <option value="">-- None / General --</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="rem-date">Due Date *</label>
            <input type="date" id="rem-date" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="rem-time">Time</label>
            <input type="time" id="rem-time" class="form-input" value="09:00">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="rem-recurrence">Recurrence</label>
            <select id="rem-recurrence" class="form-input">
              <option value="once">One-time Only</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
          <div class="form-group" style="display: flex; align-items: flex-end; padding-bottom: 8px;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; cursor: pointer; color: var(--text-main);">
              <input type="checkbox" id="rem-notify" checked style="width: 16px; height: 16px;">
              Enable Notifications
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="rem-desc">Notes / Description</label>
          <input type="text" id="rem-desc" class="form-input" placeholder="Optional notes (e.g. Account number, billing reference)" maxlength="255">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="RemindersPage.closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="reminder-submit-btn">Save Reminder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Snooze Confirmation Modal -->
  <div class="modal-overlay" id="snooze-modal" style="display: none;">
    <div class="modal-card" style="max-width: 380px;">
      <div class="modal-header">
        <h3 class="modal-title">Snooze Reminder</h3>
        <button class="modal-close-btn" onclick="RemindersPage.closeSnoozeModal()">&times;</button>
      </div>
      <div style="padding: 1rem 0;">
        <p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.875rem;">
          Delay reminder notification for this task:
        </p>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button class="btn btn-secondary btn-full" onclick="RemindersPage.confirmSnooze(1)">Snooze 1 Day</button>
          <button class="btn btn-secondary btn-full" onclick="RemindersPage.confirmSnooze(3)">Snooze 3 Days</button>
          <button class="btn btn-secondary btn-full" onclick="RemindersPage.confirmSnooze(7)">Snooze 1 Week</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reminders.js"></script>
</body>
</html>
