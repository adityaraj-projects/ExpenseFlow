<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goals — ExpenseFlow</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css?v=1.0.4">
  <link rel="stylesheet" href="../css/dashboard.css?v=1.0.4">
  <link rel="stylesheet" href="../css/responsive.css?v=1.0.4">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="page-content">
        <!-- Top Stats Banner -->
        <div class="summary-stats-grid">
          <div class="card" style="padding: 1.25rem;">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Total Saved in Goals</div>
            <div id="total-saved-kpi" style="font-size: 1.625rem; font-weight: 800; color: var(--primary); margin-top: 0.25rem;">₹0.00</div>
          </div>
          <div class="card" style="padding: 1.25rem;">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Total Target Goal Sum</div>
            <div id="total-target-kpi" style="font-size: 1.625rem; font-weight: 800; color: var(--text-main); margin-top: 0.25rem;">₹0.00</div>
          </div>
          <div class="card" style="padding: 1.25rem; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Goals Completed</div>
              <div id="goals-count-kpi" style="font-size: 1.25rem; font-weight: 800; color: var(--success); margin-top: 0.25rem;">0 of 0 completed</div>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="open-create-goal-btn">+ Create Goal</button>
          </div>
        </div>

        <!-- Goals Grid -->
        <div id="goals-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem;"></div>

        <!-- Empty State -->
        <div id="goals-empty-state" class="empty-state card" style="display: none; margin-top: 1rem;">
          <div class="empty-state-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          </div>
          <div class="empty-state-title">No savings goals created yet</div>
          <div class="empty-state-desc">Set specific savings targets for emergencies, purchases, or vacations and track your momentum.</div>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('open-create-goal-btn').click()">+ Create Savings Goal</button>
        </div>
      </main>
    </div>
  </div>

  <!-- Goal Modal (Create / Edit) -->
  <div class="modal-overlay" id="goal-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="goal-modal-title">Create Savings Goal</h3>
        <button type="button" class="btn-icon btn-ghost" id="close-goal-modal" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="goal-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="goal-name-input" class="form-label">Goal Name</label>
            <input type="text" id="goal-name-input" class="form-input" placeholder="e.g. Emergency Fund 2026" required maxlength="100">
          </div>

          <div class="form-group">
            <label for="goal-target-input" class="form-label">Target Amount</label>
            <input type="number" id="goal-target-input" class="form-input" placeholder="e.g. 200000" min="1" step="0.01" required>
          </div>

          <div class="form-group" id="initial-amount-group">
            <label for="goal-initial-input" class="form-label">Starting Amount (Optional)</label>
            <input type="number" id="goal-initial-input" class="form-input" placeholder="0.00" min="0" step="0.01">
          </div>

          <div class="form-group">
            <label for="goal-date-input" class="form-label">Target Completion Date (Optional)</label>
            <input type="date" id="goal-date-input" class="form-input">
          </div>

          <div class="form-group">
            <label for="goal-desc-input" class="form-label">Description (Optional)</label>
            <textarea id="goal-desc-input" class="form-textarea" placeholder="Why are you saving for this goal?" rows="3"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-goal-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-goal-btn">Save Goal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Deposit/Withdraw Modal -->
  <div class="modal-overlay" id="deposit-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="deposit-modal-title">Manage Funds</h3>
        <button type="button" class="btn-icon btn-ghost" id="close-deposit-modal" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="deposit-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Action</label>
            <div style="display: flex; gap: 1rem;">
              <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.625rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">
                <input type="radio" name="funds-action" value="deposit" checked>
                <span>+ Deposit Money</span>
              </label>
              <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.625rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">
                <input type="radio" name="funds-action" value="withdraw">
                <span>- Withdraw Funds</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="deposit-amount-input" class="form-label">Amount</label>
            <input type="number" id="deposit-amount-input" class="form-input" placeholder="0.00" min="0.01" step="0.01" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-deposit-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-deposit-btn">Confirm Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/goals.js"></script>
</body>
</html>
