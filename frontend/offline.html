<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — ExpenseFlow</title>
  <link rel="stylesheet" href="/css/style.css?v=1.0.4">
  <link rel="stylesheet" href="/css/auth.css?v=1.0.4">
  <link rel="stylesheet" href="/css/responsive.css?v=1.0.4">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center; max-width: 440px;">
      <div style="margin-bottom: var(--space-4);">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--warning-light); color: var(--warning);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
      </div>
      <h1 class="auth-title">You're Currently Offline</h1>
      <p class="auth-subtitle" style="margin-bottom: var(--space-6);">
        ExpenseFlow requires an active internet connection to securely fetch and sync your personal financial records.
      </p>

      <button class="btn btn-primary btn-full" onclick="window.location.reload()">
        Retry Connection
      </button>

      <div style="margin-top: var(--space-4);">
        <a href="/pages/dashboard.html" class="btn btn-secondary btn-full">
          Open Cached Dashboard
        </a>
      </div>
    </div>
  </div>
</body>
</html>
